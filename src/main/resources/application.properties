spring.application.name=baraigadWebApp
# PostgreSQL Database Connection Settings
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/baraigadDB}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configurations
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
# Applies idempotent compatibility changes before Hibernate starts. This removes
# database columns that Hibernate's update mode intentionally does not drop.
spring.sql.init.mode=always
spring.jpa.show-sql=true
# Dynamic public-form image storage. Override these environment variables in
# pre-production and production; do not use an application deployment folder.
baraigad.form-image.upload-dir=${BARAIGAD_FORM_IMAGE_UPLOAD_DIR:uploads/forms}
baraigad.form-image.max-file-size=${BARAIGAD_FORM_IMAGE_MAX_FILE_SIZE:5MB}
baraigad.mohim-image.upload-dir=${BARAIGAD_MOHIM_IMAGE_UPLOAD_DIR:uploads/mohims}
baraigad.mohim-image.max-file-size=${BARAIGAD_MOHIM_IMAGE_MAX_FILE_SIZE:20MB}
baraigad.fort-media.upload-dir=${BARAIGAD_FORT_MEDIA_UPLOAD_DIR:uploads/forts}
baraigad.fort-media.max-file-size=${BARAIGAD_FORT_MEDIA_MAX_FILE_SIZE:20MB}
baraigad.blog-image.upload-dir=${BARAIGAD_BLOG_IMAGE_UPLOAD_DIR:uploads/blogs}
baraigad.blog-image.max-file-size=${BARAIGAD_BLOG_IMAGE_MAX_FILE_SIZE:20MB}
baraigad.volunteer-photo.upload-dir=${BARAIGAD_VOLUNTEER_PHOTO_UPLOAD_DIR:uploads/volunteers}
baraigad.volunteer-photo.max-file-size=${BARAIGAD_VOLUNTEER_PHOTO_MAX_FILE_SIZE:5MB}
baraigad.work-banner.upload-dir=${BARAIGAD_WORK_BANNER_UPLOAD_DIR:uploads/work-banners}
# Allows up to 20 MB per Mohim image and multiple images in one upload request.
spring.servlet.multipart.max-file-size=${BARAIGAD_MULTIPART_MAX_FILE_SIZE:100MB}
spring.servlet.multipart.max-request-size=${BARAIGAD_MULTIPART_MAX_REQUEST_SIZE:100MB}

server.error.include-message=always
server.error.include-binding-errors=always
logging.level.org.springframework.web=DEBUG
baraigad.logging.directory=${BARAIGAD_LOG_DIR:logs}
logging.level.com.baraigad=${BARAIGAD_LOG_LEVEL:INFO}
#Added for Security
jwt.secret=${JWT_SECRET:change-this-local-development-secret-before-deployment}
jwt.expiration=86400000

#Email for birthday
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Join Us notifications are enabled. Blank recipient overrides send the
# confirmation to the participant's submitted email/mobile.
baraigad.participant-notification.enabled=${BARAIGAD_PARTICIPANT_NOTIFICATION_ENABLED:true}
baraigad.participant-notification.email-enabled=${BARAIGAD_PARTICIPANT_NOTIFICATION_EMAIL_ENABLED:true}
baraigad.participant-notification.whatsapp-enabled=${BARAIGAD_PARTICIPANT_NOTIFICATION_WHATSAPP_ENABLED:true}
baraigad.participant-notification.email-to=${BARAIGAD_PARTICIPANT_NOTIFICATION_EMAIL_TO:}
baraigad.participant-notification.whatsapp-to=${BARAIGAD_PARTICIPANT_NOTIFICATION_WHATSAPP_TO:}
baraigad.participant-notification.email-subject=Ba Raigad Parivar - Join Us registration received
baraigad.participant-notification.email-template=Hello {name},<br/><br/>Thank you for joining Ba Raigad Parivar. We received your interest in {interest}.<br/><br/>District: {district}<br/>Taluka: {taluka}<br/>Mobile: {mobile}<br/><br/>Ba Raigad Parivar
baraigad.participant-notification.whatsapp-template=Hello {name}, thank you for joining Ba Raigad Parivar. We received your interest in {interest}.

# Volunteer registration notifications. Blank recipient overrides send the confirmation to the volunteer.
baraigad.volunteer-registration-notification.enabled=${BARAIGAD_VOLUNTEER_REGISTRATION_NOTIFICATION_ENABLED:true}
baraigad.volunteer-registration-notification.email-enabled=${BARAIGAD_VOLUNTEER_REGISTRATION_NOTIFICATION_EMAIL_ENABLED:true}
baraigad.volunteer-registration-notification.whatsapp-enabled=${BARAIGAD_VOLUNTEER_REGISTRATION_NOTIFICATION_WHATSAPP_ENABLED:true}
baraigad.volunteer-registration-notification.email-to=${BARAIGAD_VOLUNTEER_REGISTRATION_NOTIFICATION_EMAIL_TO:}
baraigad.volunteer-registration-notification.whatsapp-to=${BARAIGAD_VOLUNTEER_REGISTRATION_NOTIFICATION_WHATSAPP_TO:}
baraigad.volunteer-registration-notification.email-subject=Ba Raigad Parivar - Volunteer registration received
baraigad.volunteer-registration-notification.email-template=Hello {name},<br/><br/>Thank you for registering as a volunteer with Ba Raigad Parivar.<br/><br/>Mobile: {mobile}<br/>District: {district}<br/>Taluka: {taluka}<br/><br/>Ba Raigad Parivar
baraigad.volunteer-registration-notification.whatsapp-template=Hello {name}, thank you for registering as a Ba Raigad Parivar volunteer.

# Dynamic Form submission notifications. {details} includes every filled printable field.
baraigad.dynamic-form-submission-notification.enabled=${BARAIGAD_DYNAMIC_FORM_SUBMISSION_NOTIFICATION_ENABLED:true}
baraigad.dynamic-form-submission-notification.email-enabled=${BARAIGAD_DYNAMIC_FORM_SUBMISSION_NOTIFICATION_EMAIL_ENABLED:true}
baraigad.dynamic-form-submission-notification.whatsapp-enabled=${BARAIGAD_DYNAMIC_FORM_SUBMISSION_NOTIFICATION_WHATSAPP_ENABLED:true}
baraigad.dynamic-form-submission-notification.email-to=${BARAIGAD_DYNAMIC_FORM_SUBMISSION_NOTIFICATION_EMAIL_TO:}
baraigad.dynamic-form-submission-notification.whatsapp-to=${BARAIGAD_DYNAMIC_FORM_SUBMISSION_NOTIFICATION_WHATSAPP_TO:}
baraigad.dynamic-form-submission-notification.email-subject=Ba Raigad Parivar - {formTitle} submission received
baraigad.dynamic-form-submission-notification.email-template=Hello {name},<br/><br/>We received your {formTitle} submission.<br/><br/>{details}<br/><br/>Ba Raigad Parivar
baraigad.dynamic-form-submission-notification.whatsapp-template=Hello {name}, we received your {formTitle} submission. Details:\n{details}

# Mohim registration notifications. Blank recipient overrides send the confirmation to the registered volunteer.
baraigad.mohim-registration-notification.enabled=${BARAIGAD_MOHIM_REGISTRATION_NOTIFICATION_ENABLED:true}
baraigad.mohim-registration-notification.email-enabled=${BARAIGAD_MOHIM_REGISTRATION_NOTIFICATION_EMAIL_ENABLED:true}
baraigad.mohim-registration-notification.whatsapp-enabled=${BARAIGAD_MOHIM_REGISTRATION_NOTIFICATION_WHATSAPP_ENABLED:true}
baraigad.mohim-registration-notification.email-to=${BARAIGAD_MOHIM_REGISTRATION_NOTIFICATION_EMAIL_TO:}
baraigad.mohim-registration-notification.whatsapp-to=${BARAIGAD_MOHIM_REGISTRATION_NOTIFICATION_WHATSAPP_TO:}
baraigad.mohim-registration-notification.email-subject=Ba Raigad Parivar - Mohim registration confirmed
baraigad.mohim-registration-notification.email-template=Hello {name},<br/><br/>Your registration for {activity} has been received.<br/><br/>Date: {date}<br/>Location: {location}<br/><br/>Ba Raigad Parivar
baraigad.mohim-registration-notification.whatsapp-template=Hello {name}, your registration for {activity} has been received. Date: {date}. Location: {location}.

# Birthday wishes use DOBs from Volunteers, Participants and Dynamic Form submissions.
baraigad.birthday-notification.enabled=${BARAIGAD_BIRTHDAY_NOTIFICATION_ENABLED:true}
baraigad.birthday-notification.email-enabled=${BARAIGAD_BIRTHDAY_NOTIFICATION_EMAIL_ENABLED:true}
baraigad.birthday-notification.whatsapp-enabled=${BARAIGAD_BIRTHDAY_NOTIFICATION_WHATSAPP_ENABLED:true}
baraigad.birthday-notification.cron=${BARAIGAD_BIRTHDAY_NOTIFICATION_CRON:0 0 9 * * *}
baraigad.birthday-notification.zone=${BARAIGAD_BIRTHDAY_NOTIFICATION_ZONE:Asia/Kolkata}
baraigad.birthday-notification.email-subject=Happy Birthday from Ba Raigad Parivar
baraigad.birthday-notification.email-template=Dear {name},<br/><br/>Wishing you a very happy birthday! May the year ahead bring you good health, happiness and success.<br/><br/>Ba Raigad Parivar
baraigad.birthday-notification.whatsapp-template=Dear {name}, Happy Birthday from Ba Raigad Parivar! May the year ahead bring you good health, happiness and success.
