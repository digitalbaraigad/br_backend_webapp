# Activate with SPRING_PROFILES_ACTIVE=preprod. Values are injected by the
# pre-production hosting environment; do not commit real credentials here.
server.port=${SERVER_PORT:8080}
server.error.include-message=never
server.error.include-binding-errors=never

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# One-time initial administrator bootstrap. Configure these only in the
# deployment environment, never in this file or Git. The application creates
# a SUPER_ADMIN only when no active SUPER_ADMIN exists.
# INITIAL_SUPER_ADMIN_EMAIL=
# INITIAL_SUPER_ADMIN_PASSWORD=
# INITIAL_SUPER_ADMIN_NAME=

# Persistent storage for public-form top-image attachments. Set these in the
# pre-production environment, for example /var/lib/baraigad/form-images.
baraigad.form-image.upload-dir=${BARAIGAD_FORM_IMAGE_UPLOAD_DIR}
baraigad.form-image.max-file-size=${BARAIGAD_FORM_IMAGE_MAX_FILE_SIZE:5MB}
baraigad.mohim-image.upload-dir=${BARAIGAD_MOHIM_IMAGE_UPLOAD_DIR}
baraigad.mohim-image.max-file-size=${BARAIGAD_MOHIM_IMAGE_MAX_FILE_SIZE:20MB}
baraigad.fort-media.upload-dir=${BARAIGAD_FORT_MEDIA_UPLOAD_DIR}
baraigad.gallery-media.upload-dir=${BARAIGAD_GALLERY_MEDIA_UPLOAD_DIR}
baraigad.work-banner.upload-dir=${BARAIGAD_WORK_BANNER_UPLOAD_DIR}
spring.servlet.multipart.max-file-size=${BARAIGAD_MULTIPART_MAX_FILE_SIZE:100MB}
spring.servlet.multipart.max-request-size=${BARAIGAD_MULTIPART_MAX_REQUEST_SIZE:100MB}

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Enable after MAIL_* and WHATSAPP_* credentials are configured. Blank recipient
# overrides notify the participant; set them to notify a team contact instead.
baraigad.participant-notification.enabled=${BARAIGAD_PARTICIPANT_NOTIFICATION_ENABLED:true}
baraigad.participant-notification.email-enabled=${BARAIGAD_PARTICIPANT_NOTIFICATION_EMAIL_ENABLED:true}
baraigad.participant-notification.whatsapp-enabled=${BARAIGAD_PARTICIPANT_NOTIFICATION_WHATSAPP_ENABLED:true}
baraigad.participant-notification.email-to=${BARAIGAD_PARTICIPANT_NOTIFICATION_EMAIL_TO:}
baraigad.participant-notification.whatsapp-to=${BARAIGAD_PARTICIPANT_NOTIFICATION_WHATSAPP_TO:}
baraigad.participant-notification.email-subject=Ba Raigad Parivar - Join Us registration received
baraigad.participant-notification.email-template=Hello {name},<br/><br/>Thank you for joining Ba Raigad Parivar. We received your interest in {interest}.<br/><br/>District: {district}<br/>Taluka: {taluka}<br/>Mobile: {mobile}<br/><br/>Ba Raigad Parivar
baraigad.participant-notification.whatsapp-template=Hello {name}, thank you for joining Ba Raigad Parivar. We received your interest in {interest}.

# Birthday wishes use DOBs from Volunteers, Participants and Dynamic Form submissions.
baraigad.birthday-notification.enabled=${BARAIGAD_BIRTHDAY_NOTIFICATION_ENABLED:true}
baraigad.birthday-notification.email-enabled=${BARAIGAD_BIRTHDAY_NOTIFICATION_EMAIL_ENABLED:true}
baraigad.birthday-notification.whatsapp-enabled=${BARAIGAD_BIRTHDAY_NOTIFICATION_WHATSAPP_ENABLED:true}
baraigad.birthday-notification.cron=${BARAIGAD_BIRTHDAY_NOTIFICATION_CRON:0 0 9 * * *}
baraigad.birthday-notification.zone=${BARAIGAD_BIRTHDAY_NOTIFICATION_ZONE:Asia/Kolkata}
baraigad.birthday-notification.email-subject=${BARAIGAD_BIRTHDAY_NOTIFICATION_EMAIL_SUBJECT:Happy Birthday from Ba Raigad Parivar}
baraigad.birthday-notification.email-template=${BARAIGAD_BIRTHDAY_NOTIFICATION_EMAIL_TEMPLATE:Dear {name},<br/><br/>Wishing you a very happy birthday!<br/><br/>Ba Raigad Parivar}
baraigad.birthday-notification.whatsapp-template=${BARAIGAD_BIRTHDAY_NOTIFICATION_WHATSAPP_TEMPLATE:Dear {name}, Happy Birthday from Ba Raigad Parivar!}

whatsapp.api-url=${WHATSAPP_API_URL}
whatsapp.access-token=${WHATSAPP_ACCESS_TOKEN}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://preprod.baraigad.com}
logging.level.org.springframework.web=WARN
baraigad.logging.directory=${BARAIGAD_LOG_DIR:/var/log/baraigad}
logging.level.com.baraigad=${BARAIGAD_LOG_LEVEL:INFO}
