services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-baraigad}
      POSTGRES_USER: ${POSTGRES_USER:-baraigad}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: preprod
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${JPA_DDL_AUTO:-update}
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-baraigad}
      DB_USERNAME: ${POSTGRES_USER:-baraigad}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?Set CORS_ALLOWED_ORIGINS in .env}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      WHATSAPP_API_URL: ${WHATSAPP_API_URL:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      INITIAL_SUPER_ADMIN_EMAIL: ${INITIAL_SUPER_ADMIN_EMAIL:-}
      INITIAL_SUPER_ADMIN_PASSWORD: ${INITIAL_SUPER_ADMIN_PASSWORD:-}
      INITIAL_SUPER_ADMIN_NAME: ${INITIAL_SUPER_ADMIN_NAME:-}
      BARAIGAD_FORM_IMAGE_UPLOAD_DIR: /app/uploads/forms
      BARAIGAD_MOHIM_IMAGE_UPLOAD_DIR: /app/uploads/mohims
      BARAIGAD_FORT_MEDIA_UPLOAD_DIR: /app/uploads/forts
      BARAIGAD_GALLERY_MEDIA_UPLOAD_DIR: /app/uploads/gallery
      BARAIGAD_BLOG_IMAGE_UPLOAD_DIR: /app/uploads/blogs
      BARAIGAD_VOLUNTEER_PHOTO_UPLOAD_DIR: /app/uploads/volunteers
      BARAIGAD_WORK_BANNER_UPLOAD_DIR: /app/uploads/work-banners
      BARAIGAD_LOG_DIR: /app/logs
    volumes:
      - uploads_data:/app/uploads
      - logs_data:/app/logs

  frontend:
    build:
      context: ../br_frontend_webapp
      dockerfile: Dockerfile
      args:
        VITE_DASHBOARD_ASSET_BASE: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN in .env}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${WEB_PORT:-80}:80"

volumes:
  postgres_data:
  uploads_data:
  logs_data:
