name: Backend build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Build backend
        run: ./mvnw -B -DskipTests package

      - name: Upload backend JAR
        uses: actions/upload-artifact@v4
        with:
          name: baraigad-backend-jar
          path: target/baraigadWebApp-*.jar
          if-no-files-found: error
          retention-days: 30
